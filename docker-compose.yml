services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:18-alpine
    container_name: nastart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nastart
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: nastart
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - nastart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nastart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
  
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: nastart-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ardy1607
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGPASSFILE: /pgpass
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
      - source: pgadmin-pgpass
        target: /pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

configs:
  pgadmin-servers:
    file: ./pgadmin/servers.json
  pgadmin-pgpass:
    file: ./pgadmin/pgpass

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  nastart_postgres_data:
    driver: local