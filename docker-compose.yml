services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:18-alpine
    container_name: nastart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nastart
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: nastart
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - nastart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nastart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  nastart_postgres_data:
    driver: local